<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | CargoLink Logística</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="registro-style.css"> <!-- Puedes reutilizar los estilos base -->
    <link rel="stylesheet" href="login-style.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="CargoLink.png" alt="Logo de CargoLink">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html#header">Menú</a></li>
                <li><a href="index.html#servicios">Servicios</a></li>
                <li><a href="index.html#cotizar">Cotizar Envío</a></li>
                <li><a href="index.html#rastreo">Rastrear Guía</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h2>Acceso a CargoLink</h2>
            <p class="login-desc">Ingresa a tu cuenta para gestionar y monitorear tus cargamentos en tiempo real.</p>

            <form action="#" method="post" class="login-form">

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="recuerdame" name="recuerdame">
                        <label for="recuerdame">Recordar mis datos</label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="btn-login">Ingresar</button>
                </div>

            </form>

            <div class="login-footer">
                <p>¿Aún no tienes una cuenta en CargoLink? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>Contacto: soporte@cargolink.com | Tel: +57 305 123 4567</p>
    </footer>

</body>

</html>
