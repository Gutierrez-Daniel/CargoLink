<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario | CargoLink Logística</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="registro-style.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="CargoLink.png" alt="Logo de CargoLink">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html#servicios">Servicios</a></li>
                <li><a href="index.html#cotizar">Cotizar Envío</a></li>
                <li><a href="index.html#rastreo">Rastrear Guía</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li><a href="registro.html" class="active">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main class="registro-container">
        <section class="registro-card">
            <h2>Crea tu cuenta en CargoLink</h2>
            <p class="registro-desc">Gestiona tus envíos, rastrea cargamentos y accede a tarifas preferenciales.</p>
            
            <form action="#" method="post" class="registro-form">
                
                <div class="form-group full-width">
                    <label for="tipo_cuenta">Tipo de Cuenta:</label>
                    <select id="tipo_cuenta" name="tipo_cuenta" required>
                        <option value="particular">Persona Natural / Envíos Personales</option>
                        <option value="empresa">Empresa / Cliente Corporativo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre Completo / Razón Social:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez / Logística S.A.S" required>
                </div>

                <div class="form-group">
                    <label for="documento">Documento de Identidad / NIT:</label>
                    <input type="text" id="documento" name="documento" placeholder="Ej. 123456789" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono / Celular:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+57 300 000 0000" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmar Contraseña:</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
                </div>

                <div class="form-group full-width checkbox-group">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos y condiciones y la política de tratamiento de datos.</label>
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="btn-registro">Crear Cuenta</button>
                </div>

            </form>

            <div class="registro-footer">
                <p>¿Ya tienes una cuenta? <a href="#">Inicia sesión aquí</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>Contacto: soporte@cargolink.com | Tel: +57 305 123 4567</p>
    </footer>

</body>
</html>
